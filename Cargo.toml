[package]
name = "strange_attractor"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = "0.23"
indicatif = "0.17"
crossbeam = "0.8"
rayon = "1.7"
num_cpus = "1.15"
rug = "1.19"
num-traits = "0.2.19"
rand_distr = "0.6.0"
rand = "0.10.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
